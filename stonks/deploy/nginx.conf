# Nginx site for stonks.bas-franke.com.
# The deploy workflow installs this file as /etc/nginx/sites-available/stonks on every deploy (after the certificate
# exists), so edits here go live with the next push.
# Port 80 is handled by the shared 00-default site (ACME challenges + redirect to HTTPS).

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stonks.bas-franke.com;

    ssl_certificate     /etc/letsencrypt/live/stonks.bas-franke.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stonks.bas-franke.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    # Private dashboard: keep it out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    root /var/www/stonks/frontend;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
