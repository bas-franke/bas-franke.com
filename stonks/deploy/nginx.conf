# Nginx site for stonks.bas-franke.com.
# The deploy workflow installs this file as /etc/nginx/sites-available/stonks on every deploy (after the certificate
# exists), so edits here go live with the next push.
# Port 80 is handled by the shared 00-default site (ACME challenges + redirect to HTTPS).

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stonks.bas-franke.com;

    ssl_certificate     /etc/letsencrypt/live/stonks.bas-franke.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stonks.bas-franke.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;

    # Security headers for every response. Nginx drops server-level add_header lines in any location that has its
    # own add_header, so the locations below set caching with `expires` instead and must not use add_header.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    # Private dashboard: keep it out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;
    # The on/off switch must not be clickjackable: no framing at all.
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    # Scripts and styles only from this site (React sets inline styles through the DOM, which CSP allows), fonts
    # from Google Fonts, page-view beacons to the status site. No inline scripts, plugins, <base> or framing.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://status.bas-franke.com; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    root /var/www/stonks/frontend;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        # Research uploads carry equity curves; the backend allows 4 MB after login and 32 kB before.
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Only the address Nginx saw: a client-sent X-Forwarded-For is dropped, so it cannot dodge the login limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1; # Cache-Control: no-cache
        try_files $uri $uri/ /index.html;
    }
}
