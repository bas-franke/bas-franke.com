# Nginx site for the portfolio (root domain).
# Install: sudo cp nginx.conf /etc/nginx/sites-available/portfolio
#          sudo ln -sf /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/portfolio
# Port 80 is handled by the shared 00-default site (ACME challenges + redirect to HTTPS).

# www -> apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bas-franke.com;

    ssl_certificate     /etc/letsencrypt/live/bas-franke.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bas-franke.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://bas-franke.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bas-franke.com;

    ssl_certificate     /etc/letsencrypt/live/bas-franke.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bas-franke.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    root /var/www/portfolio/frontend;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts content-hashed files in /assets, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
