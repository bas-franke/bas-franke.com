    <meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)" />

      property="og:description"

    />
    <meta property="og:url" content="https://bas-franke.com/" />
    <meta property="og:image" content="https://bas-franke.com/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="/src/fonts/newsreader-roman.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/fonts/newsreader-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/fonts/geist.woff2" as="font" type="font/woff2" crossorigin />
    <!-- No rel yet: the script below preloads only the painting of the current theme. -->
    <link id="art-light" href="/src/art/hero.webp" as="image" fetchpriority="high" />
    <link id="art-dark" href="/src/art/hero-dark.webp" as="image" fetchpriority="high" />
    <script>
      // Pick the theme before the first paint so there is no flash of the wrong colours or a fetch of the wrong painting.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        document.getElementById('art-' + theme).rel = 'preload';
      })();
    </script>
  </head>
