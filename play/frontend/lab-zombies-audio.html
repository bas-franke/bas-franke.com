<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Last Light audio lab</title>
    <style>
      body { background: #111; color: #ddd; font: 14px system-ui, sans-serif; padding: 16px; }
      button { margin: 3px; padding: 6px 10px; background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 4px; cursor: pointer; }
      table { border-collapse: collapse; margin-top: 12px; }
      td, th { padding: 2px 10px; border-bottom: 1px solid #333; text-align: right; }
      td:first-child, th:first-child { text-align: left; }
      .bad { color: #ff7a59; }
    </style>
  </head>
  <body>
    <h1>Last Light audio lab</h1>
    <p>Buttons play live (click once to unlock). The table renders every sound offline and reports peak, RMS and timbre (spectral centroid, attack, decay to -40 dB).</p>
    <div id="buttons"></div>
    <table id="levels"><thead><tr><th>sound</th><th>peak</th><th>rms</th><th>centroid Hz</th><th>attack ms</th><th>decay s</th><th>render ms</th></tr></thead><tbody></tbody></table>
    <script type="module" src="/src/games/zombies/audiolab.ts"></script>
  </body>
</html>
