# Nginx site for play.bas-franke.com.
# Install: sudo cp nginx.conf /etc/nginx/sites-available/play
#          sudo ln -sf /etc/nginx/sites-available/play /etc/nginx/sites-enabled/play
# Port 80 is handled by the shared 00-default site (ACME challenges + redirect to HTTPS).

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name play.bas-franke.com;

    ssl_certificate     /etc/letsencrypt/live/play.bas-franke.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play.bas-franke.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    root /var/www/play/frontend;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;

    # Game traffic: one WebSocket per player, kept open for the whole session.
    location = /api/ws {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 3D models change rarely and are fetched on every room join; cache for a day.
    location /models/ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
